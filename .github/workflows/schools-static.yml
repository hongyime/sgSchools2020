name: School directory checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: schools-static-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  directory:
    name: Static directory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate archived links, resources and navigation
        run: python3 tests/check_site.py
